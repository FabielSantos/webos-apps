<p><b>Hello TV</b> é o app de teste deste repositório.</p>
<p>Mostra uma mensagem de confirmação e um relógio ao vivo, para validar o fluxo completo:
empacotamento com <code>@webos-tools/cli</code>, publicação no GitHub Pages e instalação
pelo Homebrew Channel no webOS 5.</p>
<p>Não precisa de root. Não usa APIs Luna.</p>
