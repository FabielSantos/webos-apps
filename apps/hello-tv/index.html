<!DOCTYPE html>
<html>
<head>
<title>Hello TV</title>
<style type="text/css">
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: #202020;
        font-family: sans-serif;
    }
    div {
        position: absolute;
        height: 100%;
        width: 100%;
        display: table;
    }
    h1 {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
        color: #00e676;
    }
    p {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
        color: #cccccc;
        font-size: 1.2em;
    }
</style>
</head>
<body>
    <div>
        <h1>✅ Instalado pelo MEU repositório!<br><span id="clock" style="font-size:0.6em;color:#9e9e9e;"></span></h1>
    </div>
    <script>
        function tick() {
            document.getElementById('clock').textContent = new Date().toLocaleString();
        }
        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
