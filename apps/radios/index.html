<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rádios</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">Rádios</div>
    <div id="clock" class="clock"></div>
  </header>
  <main>
    <nav id="cats" class="cats"></nav>
    <section class="stations-box">
      <div id="list-title" class="list-title"></div>
      <div id="stations" class="stations"></div>
    </section>
    <aside id="now" class="now"></aside>
  </main>
  <footer id="hints" class="hints"></footer>

  <div id="search" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-title">Buscar rádio</div>
      <input id="query" type="text" placeholder="Nome da rádio ou estilo (ex.: CBN, jazz, sertanejo) e OK" autocomplete="off">
      <div id="search-status" class="search-status"></div>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
