<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Canais</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="browse" class="browse">
    <header>
      <div class="brand">Canais</div>
      <div id="clock" class="clock"></div>
    </header>
    <main>
      <nav id="sources" class="sources"></nav>
      <section class="channels-box">
        <div id="list-title" class="list-title"></div>
        <div id="channels" class="channels"></div>
      </section>
    </main>
    <footer id="hints" class="hints"></footer>
  </div>

  <div id="player" class="player hidden">
    <video id="video" autoplay></video>
    <div id="osd" class="osd"></div>
    <div id="pstatus" class="pstatus"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
