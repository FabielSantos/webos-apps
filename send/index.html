<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Enviar pra TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #4f46e5; --ok: #16a34a; --err: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #141b2e; --text: #e2e8f0; --muted: #94a3b8; --line: #243049; --accent: #818cf8; --ok: #4ade80; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; background: transparent; color: var(--text); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, label.btn { flex: 1 1 auto; min-height: 44px; border: 0; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 600;
    background: var(--line); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .status { min-height: 22px; font-size: 14px; margin-top: 10px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
  li small { color: var(--muted); display: block; }
  .setup { color: var(--muted); font-size: 14px; }
  code { font-size: 13px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Enviar pra TV</h1>
  <div class="sub" id="channel"></div>

  <div id="app" hidden>
    <div class="card">
      <textarea id="text" placeholder="Cole um link (YouTube, vídeo, foto, site) ou escreva um recado"></textarea>
      <div class="row">
        <button id="paste" type="button">Colar</button>
        <button id="send" class="primary" type="button">Enviar</button>
      </div>
      <div class="row">
        <label class="btn" for="file">Foto ou vídeo do celular</label>
        <input id="file" type="file" accept="image/*,video/*,audio/*">
      </div>
      <div id="status" class="status"></div>
    </div>
    <h2>Enviados</h2>
    <ul id="sent"></ul>
  </div>

  <div id="setup" class="card setup" hidden>
    Abra o app <b>Enviar pra TV</b> na TV e escaneie o QR code com a câmera do celular.
  </div>
</main>

<script>
(() => {
  const NTFY = 'https://ntfy.sh/';
  const $ = (id) => document.getElementById(id);

  // Topic comes in the URL fragment from the TV's QR code (never sent to the server) and is remembered.
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('t');
  if (fromHash) { localStorage.setItem('topic', fromHash); history.replaceState(null, '', location.pathname + location.search); }
  const topic = localStorage.getItem('topic');
  if (!topic) { $('setup').hidden = false; return; }
  $('app').hidden = false;
  $('channel').textContent = 'Canal: ' + topic;

  const sent = JSON.parse(localStorage.getItem('sent') || '[]');
  const renderSent = () => {
    $('sent').innerHTML = '';
    sent.slice(0, 15).forEach((s) => {
      const li = document.createElement('li');
      li.textContent = s.text;
      const small = document.createElement('small');
      small.textContent = new Date(s.at).toLocaleString('pt-BR');
      li.appendChild(small);
      $('sent').appendChild(li);
    });
  };
  const remember = (text) => { sent.unshift({ text, at: Date.now() }); localStorage.setItem('sent', JSON.stringify(sent.slice(0, 30))); renderSent(); };
  const status = (msg, cls) => { $('status').textContent = msg; $('status').className = 'status ' + (cls || ''); };

  async function sendText(text) {
    text = (text || '').trim();
    if (!text) { status('Escreva ou cole algo primeiro.', 'err'); return; }
    $('send').disabled = true; status('Enviando…');
    try {
      const r = await fetch(NTFY + topic, { method: 'POST', body: text });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      remember(text); $('text').value = ''; status('Enviado ✓ — abrindo na TV', 'ok');
    } catch (e) { status('Falhou: ' + e.message, 'err'); }
    $('send').disabled = false;
  }

  async function sendFile(file) {
    if (file.size > 15 * 1024 * 1024) { status('Arquivo maior que 15 MB (limite do ntfy.sh).', 'err'); return; }
    status('Enviando ' + file.name + '…');
    try {
      const r = await fetch(NTFY + topic, { method: 'PUT', body: file, headers: { Filename: file.name } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      remember('📎 ' + file.name); status('Enviado ✓ — abrindo na TV', 'ok');
    } catch (e) { status('Falhou: ' + e.message, 'err'); }
  }

  $('send').onclick = () => sendText($('text').value);
  $('file').onchange = (e) => { if (e.target.files[0]) sendFile(e.target.files[0]); e.target.value = ''; };
  $('paste').onclick = async () => {
    try { $('text').value = await navigator.clipboard.readText(); }
    catch (e) { status('Não consegui ler a área de transferência — cole manualmente.', 'err'); }
  };
  renderSent();

  // Android "Compartilhar" (Web Share Target): ?title=&text=&url= → send right away
  const q = new URLSearchParams(location.search);
  const shared = q.get('url') || (q.get('text') || '').match(/https?:\/\/\S+/)?.[0] || q.get('text');
  if (shared) { history.replaceState(null, '', location.pathname); sendText(shared); }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
